name: Cloudflare Worker checks

on:
  push:
    branches:
      - platform-integration
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/worker/package.json
      - run: npm install
      - run: npm run typecheck
