name: Deploy Paper Plane Worker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy-worker.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate D1 migrations
        run: python3 scripts/validate_migrations.py

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Test Admin API against isolated local D1
        run: npm run test:integration

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: npm run db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
