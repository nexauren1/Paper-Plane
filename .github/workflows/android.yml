name: Android build

concurrency:
  group: paper-plane-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - flutter-app-foundation
      - platform-integration
      - release-hardening-public
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files if missing
        run: flutter create --platforms=android --project-name paper_plane --org com.nexauren .

      - name: Configure Android notification permission and icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("Android manifest was not generated.")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if "android.permission.POST_NOTIFICATIONS" not in content:
              manifest_start = content.find("<manifest")
              if manifest_start < 0:
                  raise SystemExit("Android manifest root is missing.")
              marker = content.find(">", manifest_start)
              if marker < 0:
                  raise SystemExit("Invalid Android manifest.")
              content = content[:marker + 1] + "\n" + permission + content[marker + 1:]
              manifest.write_text(content, encoding="utf-8")

          icon = Path("android/app/src/main/res/drawable/ic_notification.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M2,21L23,12L2,3L2,10L17,12L2,14Z" />
          </vector>
          """, encoding="utf-8")
          print("Android notification permission and monochrome airplane icon are configured.")
          PY

      - name: Use direct Gradle distribution host
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("Gradle wrapper properties were not generated.")

          content = wrapper.read_text(encoding="utf-8")
          if "services.gradle.org/distributions/" not in content:
              raise SystemExit("Unexpected Gradle distribution URL; refusing to change an unknown wrapper.")
          content = content.replace(
              "services.gradle.org/distributions/",
              "mirrors.huaweicloud.com/gradle/",
          ).replace("-all.zip", "-bin.zip")
          wrapper.write_text(content, encoding="utf-8")
          print("Gradle wrapper will use the binary distribution from the Huawei Cloud mirror.")
          PY

      - name: Configure Maven mirrors for Android build dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          root_build = Path("android/build.gradle.kts")
          if not settings.exists() or not root_build.exists():
              raise SystemExit("Generated Gradle settings/build files were not found.")

          def add_mirrors(path: Path, repositories_start: int):
              content = path.read_text(encoding="utf-8")
              if "repo.huaweicloud.com/repository/maven/" in content:
                  return content
              marker = "repositories {"
              index = content.find(marker, repositories_start)
              if index < 0:
                  raise SystemExit(f"Could not locate repositories block in {path}.")
              block_end = content.find("}", index + len(marker))
              google_line = content.find("google()", index + len(marker), block_end)
              if google_line >= 0:
                  newline = content.find("\n", google_line)
                  insert_at = newline if newline >= 0 else google_line + len("google()")
              else:
                  insert_at = index + len(marker)
              mirror_lines = (
                  '\n            maven { url = uri("https://maven.aliyun.com/repository/public") }'
                  '\n            maven { url = uri("https://repo.huaweicloud.com/repository/maven/") }'
              )
              return content[:insert_at] + "".join(mirror_lines) + content[insert_at:]

          settings_text = settings.read_text(encoding="utf-8")
          plugin_management = settings_text.find("pluginManagement {")
          if plugin_management < 0:
              raise SystemExit("Could not locate pluginManagement in generated settings.")
          settings.write_text(add_mirrors(settings, plugin_management), encoding="utf-8")

          root_text = root_build.read_text(encoding="utf-8")
          root_build.write_text(add_mirrors(root_build, 0), encoding="utf-8")
          print("Added Maven Central/Gradle Plugin Portal mirrors before default repositories.")
          PY

      - name: Configure Firebase Android and build variables
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          config_path = Path("firebase/google-services.json")
          if not config_path.exists():
              raise SystemExit("firebase/google-services.json is missing from the repository.")

          config = json.loads(config_path.read_text(encoding="utf-8"))
          project = config["project_info"]
          android = next(
              (item for item in config["client"]
               if item["client_info"]["android_client_info"]["package_name"] == "com.nexauren.paper_plane"),
              None,
          )
          if android is None:
              raise SystemExit("Firebase config does not contain com.nexauren.paper_plane.")

          web_client = next(
              (item["client_id"] for item in android.get("oauth_client", [])
               if item.get("client_type") == 3),
              None,
          )
          if not web_client:
              raise SystemExit("Firebase config is missing the Google Web OAuth client (client_type 3).")

          app_dir = Path("android/app")
          app_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(config_path, app_dir / "google-services.json")

          settings_path = next(
              (candidate for candidate in (Path("android/settings.gradle.kts"), Path("android/settings.gradle"))
               if candidate.exists()),
              None,
          )
          app_gradle_path = next(
              (candidate for candidate in (app_dir / "build.gradle.kts", app_dir / "build.gradle")
               if candidate.exists()),
              None,
          )
          if settings_path is None or app_gradle_path is None:
              raise SystemExit("Flutter Android Gradle files were not generated as expected.")

          def add_google_services_plugin(path, apply_false):
              lines = path.read_text(encoding="utf-8").splitlines()
              if any("com.google.gms.google-services" in line for line in lines):
                  return
              plugin_index = next(
                  (index for index, line in enumerate(lines)
                   if line.strip().startswith("id") and "com.android.application" in line),
                  None,
              )
              if plugin_index is None:
                  raise SystemExit(f"Could not find the Android application plugin in {path}.")
              indent = lines[plugin_index][:len(lines[plugin_index]) - len(lines[plugin_index].lstrip())]
              kotlin = path.suffix == ".kts"
              if apply_false and kotlin:
                  plugin = indent + 'id("com.google.gms.google-services") version "4.5.0" apply false'
              elif apply_false:
                  plugin = indent + 'id "com.google.gms.google-services" version "4.5.0" apply false'
              elif kotlin:
                  plugin = indent + 'id("com.google.gms.google-services")'
              else:
                  plugin = indent + 'id "com.google.gms.google-services"'
              lines.insert(plugin_index + 1, plugin)
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          add_google_services_plugin(settings_path, apply_false=True)
          add_google_services_plugin(app_gradle_path, apply_false=False)

          env_values = {
              "FIREBASE_API_KEY": android["api_key"][0]["current_key"],
              "FIREBASE_APP_ID": android["client_info"]["mobilesdk_app_id"],
              "FIREBASE_MESSAGING_SENDER_ID": project["project_number"],
              "FIREBASE_PROJECT_ID": project["project_id"],
              "GOOGLE_SERVER_CLIENT_ID": web_client,
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in env_values.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run widget tests
        run: flutter test

      - name: Configure permanent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/prepare_android_signing.py

      - name: Build release APK with Firebase
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=PAPER_PLANE_API_BASE_URL="https://paper-plane.nexaurenstore.workers.dev"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paper-plane-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Admin Android project
        working-directory: admin_app
        run: flutter create --platforms=android --project-name paper_plane_admin --org com.nexauren .

      - name: Configure Admin app label
        working-directory: admin_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('android:label="paper_plane_admin"', 'android:label="Paper Plane Admin"')
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Configure Firebase build values
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path("firebase/google-services.json").read_text(encoding="utf-8"))
          project = config["project_info"]
          client = next(
              item for item in config["client"]
              if item["client_info"]["android_client_info"]["package_name"] == "com.nexauren.paper_plane"
          )
          values = {
              "FIREBASE_API_KEY": client["api_key"][0]["current_key"],
              "FIREBASE_APP_ID": client["client_info"]["mobilesdk_app_id"],
              "FIREBASE_MESSAGING_SENDER_ID": project["project_number"],
              "FIREBASE_PROJECT_ID": project["project_id"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          PY

      - name: Install Admin dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Configure permanent Admin APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 admin_app/tool/prepare_android_signing.py

      - name: Build signed Admin APK
        working-directory: admin_app
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=ADMIN_API_BASE_URL="https://paper-plane.nexaurenstore.workers.dev"

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: paper-plane-admin-android-release
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install

      - name: Type-check Cloudflare Worker
        working-directory: cloudflare/worker
        run: npm run typecheck

      - name: Validate D1 migrations
        working-directory: cloudflare/worker
        run: npm run db:test
