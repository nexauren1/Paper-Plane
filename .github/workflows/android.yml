name: Android build

concurrency:
  group: paper-plane-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - flutter-app-foundation
      - platform-integration
      - release-hardening-public
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files if missing
        run: flutter create --platforms=android --project-name paper_plane --org com.nexauren .

      - name: Configure Android notification permission and icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("Android manifest was not generated.")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if "android.permission.POST_NOTIFICATIONS" not in content:
              manifest_start = content.find("<manifest")
              if manifest_start < 0:
                  raise SystemExit("Android manifest root is missing.")
              marker = content.find(">", manifest_start)
              if marker < 0:
                  raise SystemExit("Invalid Android manifest.")
              content = content[:marker + 1] + "\n" + permission + content[marker + 1:]
              manifest.write_text(content, encoding="utf-8")

          icon = Path("android/app/src/main/res/drawable/ic_notification.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M2,21L23,12L2,3L2,10L17,12L2,14Z" />
          </vector>
          """, encoding="utf-8")
          print("Android notification permission and monochrome airplane icon are configured.")
          PY

      - name: Configure Paper Plane launcher icon and branded native splash
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("android/app/src/main/res")
          drawable = res / "drawable"
          values = res / "values"
          drawable.mkdir(parents=True, exist_ok=True)
          values.mkdir(parents=True, exist_ok=True)

          background = """<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="24dp" />
              <gradient android:type="radial" android:gradientRadius="100%p"
                  android:centerX="50%" android:centerY="38%"
                  android:startColor="#FF1A4977" android:centerColor="#FF0B2444"
                  android:endColor="#FF050D1B" />
              <stroke android:width="1dp" android:color="#FF397BA5" />
          </shape>
          """
          (drawable / "ic_launcher_background.xml").write_text(background, encoding="utf-8")

          foreground = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#6655C7E8"
                  android:strokeWidth="2.2"
                  android:pathData="M13,56 C16,24 48,9 77,20 C101,30 105,61 87,79" />
              <path android:fillColor="#00000000" android:strokeColor="#77F0CE7C"
                  android:strokeWidth="1.5"
                  android:pathData="M20,83 C38,99 68,98 86,80" />
              <path android:fillColor="#FFFFE7A8" android:pathData="M22,20a2.5,2.5 0,1 0,5 0a2.5,2.5 0,1 0,-5 0" />
              <path android:fillColor="#FF8EDFFF" android:pathData="M81,17a2,2 0,1 0,4 0a2,2 0,1 0,-4 0" />
              <path android:fillColor="#FFFFE7A8" android:pathData="M91,63a1.8,1.8 0,1 0,3.6 0a1.8,1.8 0,1 0,-3.6 0" />
              <path android:fillColor="#FF55C7E8" android:pathData="M13,75a1.6,1.6 0,1 0,3.2 0a1.6,1.6 0,1 0,-3.2 0" />
              <path android:fillColor="#FFFFFFFF" android:strokeColor="#FFB8F1FF"
                  android:strokeWidth="1.8" android:strokeLineJoin="round"
                  android:pathData="M19,53 L88,28 L65,84 L48,65 L29,73 Z" />
              <path android:fillColor="#FFEAFBFF"
                  android:pathData="M19,53 L88,28 L48,65 Z" />
              <path android:fillColor="#FF9AD9F2"
                  android:pathData="M88,28 L65,84 L48,65 Z" />
              <path android:fillColor="#FFFFD985"
                  android:pathData="M48,65 L65,84 L55,66 Z" />
              <path android:fillColor="#00000000" android:strokeColor="#FF557D9D"
                  android:strokeWidth="1.1" android:pathData="M29,73 L48,65 L88,28" />
          </vector>
          """
          (drawable / "ic_launcher_foreground.xml").write_text(foreground, encoding="utf-8")

          legacy_icon = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FF071225" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FF12365B" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#00000000" android:strokeColor="#6655C7E8"
                  android:strokeWidth="2.2" android:pathData="M13,56 C16,24 48,9 77,20 C101,30 105,61 87,79" />
              <path android:fillColor="#00000000" android:strokeColor="#77F0CE7C"
                  android:strokeWidth="1.5" android:pathData="M20,83 C38,99 68,98 86,80" />
              <path android:fillColor="#FFFFE7A8" android:pathData="M22,20a2.5,2.5 0,1 0,5 0a2.5,2.5 0,1 0,-5 0" />
              <path android:fillColor="#FFFFFFFF" android:strokeColor="#FFB8F1FF"
                  android:strokeWidth="1.8" android:strokeLineJoin="round"
                  android:pathData="M19,53 L88,28 L65,84 L48,65 L29,73 Z" />
              <path android:fillColor="#FFEAFBFF" android:pathData="M19,53 L88,28 L48,65 Z" />
              <path android:fillColor="#FF9AD9F2" android:pathData="M88,28 L65,84 L48,65 Z" />
              <path android:fillColor="#FFFFD985" android:pathData="M48,65 L65,84 L55,66 Z" />
          </vector>
          """
          anydpi = res / "mipmap-anydpi"
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / "ic_launcher.xml").write_text(legacy_icon, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(legacy_icon, encoding="utf-8")

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          adaptive_xml = """<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          """
          (adaptive / "ic_launcher.xml").write_text(adaptive_xml, encoding="utf-8")
          (adaptive / "ic_launcher_round.xml").write_text(adaptive_xml, encoding="utf-8")

          # Remove Flutter's generated bitmap launcher marks so Android always
          # resolves the custom Paper Plane vector resource instead.
          for folder in res.glob("mipmap-*"):
              if folder.name in {"mipmap-anydpi", "mipmap-anydpi-v26"}:
                  continue
              for filename in (
                  "ic_launcher.png", "ic_launcher.webp",
                  "ic_launcher_round.png", "ic_launcher_round.webp",
              ):
                  candidate = folder / filename
                  if candidate.exists():
                      candidate.unlink()

          colors = values / "colors.xml"
          color_entry = '<color name="ic_launcher_background">#071225</color>'
          if colors.exists():
              content = colors.read_text(encoding="utf-8")
              if 'name="ic_launcher_background"' in content:
                  content = re.sub(
                      r'<color name="ic_launcher_background">.*?</color>',
                      color_entry,
                      content,
                      count=1,
                  )
              else:
                  content = content.replace("</resources>", f"    {color_entry}\n</resources>")
          else:
              content = '<resources>\n    ' + color_entry + '\n</resources>\n'
          colors.write_text(content, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = re.sub(r'android:label="[^"]+"', 'android:label="Paper Plane"', text, count=1)
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text, count=1)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text, count=1)
          else:
              text = text.replace('android:icon="@mipmap/ic_launcher"',
                                  'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          manifest.write_text(text, encoding="utf-8")

          launch = drawable / "launch_background.xml"
          launch.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_background" />
              <item
                  android:drawable="@drawable/ic_launcher_foreground"
                  android:width="108dp"
                  android:height="108dp"
                  android:gravity="center" />
          </layer-list>
          """, encoding="utf-8")

          styles = values / "styles.xml"
          if styles.exists():
              style_text = styles.read_text(encoding="utf-8")
              if "android:windowSplashScreenBackground" not in style_text:
                  style_text = style_text.replace(
                      "</style>",
                      '        <item name="android:windowSplashScreenBackground">#071225</item>\n'
                      '        <item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_launcher_foreground</item>\n'
                      '    </style>',
                      1,
                  )
              styles.write_text(style_text, encoding="utf-8")
          print("Paper Plane launcher/adaptive icon and branded native splash configured.")
          PY

      - name: Enable core library desugaring for Android notifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated.")
          content = gradle.read_text(encoding="utf-8")
          kotlin = gradle.suffix == ".kts"

          if "compileOptions {" not in content:
              raise SystemExit("Could not find the Android compileOptions block.")
          if kotlin:
              setting = "        isCoreLibraryDesugaringEnabled = true"
              dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          else:
              setting = "        coreLibraryDesugaringEnabled true"
              dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"

          if "isCoreLibraryDesugaringEnabled = true" not in content and "coreLibraryDesugaringEnabled true" not in content:
              content = content.replace("    compileOptions {", "    compileOptions {\n" + setting, 1)
          if "desugar_jdk_libs" not in content:
              marker = "dependencies {"
              index = content.find(marker)
              if index < 0:
                  content += "\n\ndependencies {\n" + dependency + "\n}\n"
              else:
                  insert_at = index + len(marker)
                  content = content[:insert_at] + "\n" + dependency + content[insert_at:]
          gradle.write_text(content, encoding="utf-8")
          print(f"Enabled core library desugaring in {gradle}.")
          PY

      - name: Use direct Gradle distribution host
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("Gradle wrapper properties were not generated.")

          content = wrapper.read_text(encoding="utf-8")
          if "services.gradle.org/distributions/" not in content:
              raise SystemExit("Unexpected Gradle distribution URL; refusing to change an unknown wrapper.")
          content = content.replace(
              "services.gradle.org/distributions/",
              "mirrors.huaweicloud.com/gradle/",
          ).replace("-all.zip", "-bin.zip")
          wrapper.write_text(content, encoding="utf-8")
          print("Gradle wrapper will use the binary distribution from the Huawei Cloud mirror.")
          PY

      - name: Configure Maven mirrors for Android build dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          root_build = Path("android/build.gradle.kts")
          if not settings.exists() or not root_build.exists():
              raise SystemExit("Generated Gradle settings/build files were not found.")

          def add_mirrors(path: Path, repositories_start: int):
              content = path.read_text(encoding="utf-8")
              if "repo.huaweicloud.com/repository/maven/" in content:
                  return content
              marker = "repositories {"
              index = content.find(marker, repositories_start)
              if index < 0:
                  raise SystemExit(f"Could not locate repositories block in {path}.")
              block_end = content.find("}", index + len(marker))
              google_line = content.find("google()", index + len(marker), block_end)
              if google_line >= 0:
                  newline = content.find("\n", google_line)
                  insert_at = newline if newline >= 0 else google_line + len("google()")
              else:
                  insert_at = index + len(marker)
              mirror_lines = (
                  '\n            maven { url = uri("https://maven.aliyun.com/repository/public") }'
                  '\n            maven { url = uri("https://repo.huaweicloud.com/repository/maven/") }'
              )
              return content[:insert_at] + "".join(mirror_lines) + content[insert_at:]

          settings_text = settings.read_text(encoding="utf-8")
          plugin_management = settings_text.find("pluginManagement {")
          if plugin_management < 0:
              raise SystemExit("Could not locate pluginManagement in generated settings.")
          settings.write_text(add_mirrors(settings, plugin_management), encoding="utf-8")

          root_text = root_build.read_text(encoding="utf-8")
          root_build.write_text(add_mirrors(root_build, 0), encoding="utf-8")
          print("Added Maven Central/Gradle Plugin Portal mirrors before default repositories.")
          PY

      - name: Configure Firebase Android and build variables
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          config_path = Path("firebase/google-services.json")
          if not config_path.exists():
              raise SystemExit("firebase/google-services.json is missing from the repository.")

          config = json.loads(config_path.read_text(encoding="utf-8"))
          project = config["project_info"]
          android = next(
              (item for item in config["client"]
               if item["client_info"]["android_client_info"]["package_name"] == "com.nexauren.paper_plane"),
              None,
          )
          if android is None:
              raise SystemExit("Firebase config does not contain com.nexauren.paper_plane.")

          web_client = next(
              (item["client_id"] for item in android.get("oauth_client", [])
               if item.get("client_type") == 3),
              None,
          )
          if not web_client:
              raise SystemExit("Firebase config is missing the Google Web OAuth client (client_type 3).")

          app_dir = Path("android/app")
          app_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(config_path, app_dir / "google-services.json")

          settings_path = next(
              (candidate for candidate in (Path("android/settings.gradle.kts"), Path("android/settings.gradle"))
               if candidate.exists()),
              None,
          )
          app_gradle_path = next(
              (candidate for candidate in (app_dir / "build.gradle.kts", app_dir / "build.gradle")
               if candidate.exists()),
              None,
          )
          if settings_path is None or app_gradle_path is None:
              raise SystemExit("Flutter Android Gradle files were not generated as expected.")

          def add_google_services_plugin(path, apply_false):
              lines = path.read_text(encoding="utf-8").splitlines()
              if any("com.google.gms.google-services" in line for line in lines):
                  return
              plugin_index = next(
                  (index for index, line in enumerate(lines)
                   if line.strip().startswith("id") and "com.android.application" in line),
                  None,
              )
              if plugin_index is None:
                  raise SystemExit(f"Could not find the Android application plugin in {path}.")
              indent = lines[plugin_index][:len(lines[plugin_index]) - len(lines[plugin_index].lstrip())]
              kotlin = path.suffix == ".kts"
              if apply_false and kotlin:
                  plugin = indent + 'id("com.google.gms.google-services") version "4.5.0" apply false'
              elif apply_false:
                  plugin = indent + 'id "com.google.gms.google-services" version "4.5.0" apply false'
              elif kotlin:
                  plugin = indent + 'id("com.google.gms.google-services")'
              else:
                  plugin = indent + 'id "com.google.gms.google-services"'
              lines.insert(plugin_index + 1, plugin)
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          add_google_services_plugin(settings_path, apply_false=True)
          add_google_services_plugin(app_gradle_path, apply_false=False)

          env_values = {
              "FIREBASE_API_KEY": android["api_key"][0]["current_key"],
              "FIREBASE_APP_ID": android["client_info"]["mobilesdk_app_id"],
              "FIREBASE_MESSAGING_SENDER_ID": project["project_number"],
              "FIREBASE_PROJECT_ID": project["project_id"],
              "GOOGLE_SERVER_CLIENT_ID": web_client,
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in env_values.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run widget tests
        run: flutter test

      - name: Configure permanent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/prepare_android_signing.py

      - name: Build release APK with Firebase
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=PAPER_PLANE_API_BASE_URL="https://paper-plane.nexaurenstore.workers.dev"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paper-plane-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Admin Android project
        working-directory: admin_app
        run: flutter create --platforms=android --project-name paper_plane_admin --org com.nexauren .

      - name: Configure Admin app label
        working-directory: admin_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('android:label="paper_plane_admin"', 'android:label="Paper Plane Admin"')
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Configure Firebase build values
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path("firebase/google-services.json").read_text(encoding="utf-8"))
          project = config["project_info"]
          client = next(
              item for item in config["client"]
              if item["client_info"]["android_client_info"]["package_name"] == "com.nexauren.paper_plane"
          )
          values = {
              "FIREBASE_API_KEY": client["api_key"][0]["current_key"],
              "FIREBASE_APP_ID": client["client_info"]["mobilesdk_app_id"],
              "FIREBASE_MESSAGING_SENDER_ID": project["project_number"],
              "FIREBASE_PROJECT_ID": project["project_id"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          PY

      - name: Install Admin dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Configure permanent Admin APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 admin_app/tool/prepare_android_signing.py

      - name: Build signed Admin APK
        working-directory: admin_app
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=ADMIN_API_BASE_URL="https://paper-plane.nexaurenstore.workers.dev"

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: paper-plane-admin-android-release
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --legacy-peer-deps

      - name: Type-check Cloudflare Worker
        working-directory: cloudflare/worker
        run: npm run typecheck

      - name: Validate D1 migrations
        working-directory: cloudflare/worker
        run: npm run db:test
